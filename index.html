<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Health Signal</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { display: flex; width: 95%; max-width: 1200px; gap: 20px; }
  .form-panel { flex: 1; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .result-panel { flex: 0.7; background: linear-gradient(180deg, #0a3d3a, #1a7a74); color: white; padding: 30px; border-radius: 12px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .section-title { font-size: 14px; font-weight: 600; color: #555; margin: 20px 0 10px; }
  .section-badge { background: #e0e0e0; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  label { font-size: 13px; color: #444; display: block; margin-bottom: 5px; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
  .stress-buttons { display: flex; gap: 8px; }
  .stress-buttons button { flex: 1; padding: 8px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; }
  .stress-buttons button.active { background: #d97706; color: white; border-color: #d97706; }
  .submit-btn { width: 100%; padding: 12px; background: #0a3d3a; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 20px; cursor: pointer; }
  .gauge { width: 150px; height: 80px; margin: 20px auto; position: relative; }
  .gauge-fill { width: 150px; height: 75px; border: 10px solid #ffffff30; border-bottom: none; border-radius: 150px 150px 0 0; }
  .gauge-dot { width: 10px; height: 10px; background: white; border-radius: 50%; position: absolute; bottom: 0; left: 50%; transform-origin: center -65px; }
  .score { font-size: 48px; font-weight: bold; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="form-panel">
      <form id="mh-form">
        
        <!-- 01 PROFILE - ADDED -->
        <div class="form-section">
          <div class="section-title"><span class="section-badge">01</span> Profile</div>
          <div class="grid-2">
            <div><label>Age</label><input type="number" name="age" required value="21"></div>
            <div>
              <label>Gender</label>
              <select name="gender" required><option>Male</option><option>Female</option></select>
            </div>
          </div>
          <label>Country</label><input type="text" name="country" required value="India">
        </div>

        <!-- 02 ACADEMIC -->
        <div class="form-section">
          <div class="section-title"><span class="section-badge">02</span> Academic & Digital Habits</div>
          <div class="grid-2">
            <div>
              <label>Academic level</label>
              <select name="academic_level" required><option>High School</option><option selected>Undergraduate</option><option>Graduate</option></select>
            </div>
            <div>
              <label>Most-used platform</label>
              <select name="most_used_platform" required><option selected>Instagram</option><option>YouTube</option><option>WhatsApp</option></select>
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label>Primary purpose</label>
              <select name="purpose_of_use" required><option>Networking</option><option>Education</option><option selected>Entertainment</option><option>News</option></select>
            </div>
            <div><label>Avg. daily screen time</label><input type="number" step="0.1" name="avg_daily_usage_hours" required value="10"></div>
          </div>
          <label>Daily phone unlocks</label><input type="number" name="daily_unlocks" required value="60">
        </div>

        <!-- 03 LIFESTYLE -->
        <div class="form-section">
          <div class="section-title"><span class="section-badge">03</span> Lifestyle & Stress</div>
          <div class="grid-3">
            <div><label>Study hours / day</label><input type="number" step="0.1" name="study_hours" required value="2"></div>
            <div><label>Physical activity / day</label><input type="number" step="0.1" name="physical_activity_hours" required value="1"></div>
            <div><label>Sleep / night</label><input type="number" step="0.1" name="sleep_hours_per_night" required value="7"></div>
          </div>
          <label>Perceived stress level</label>
          <div class="stress-buttons">
            <button type="button" data-value="Low">Low</button>
            <button type="button" data-value="Medium">Medium</button>
            <button type="button" data-value="High" class="active">High</button>
            <button type="button" data-value="Very High">Very High</button>
          </div>
          <input type="hidden" name="stress_level" id="stress_level" value="High">
        </div>

        <button type="submit" class="submit-btn">Read my signal</button>
      </form>
    </div>

    <!-- RIGHT PANEL -->
    <div class="result-panel">
      <div id="state-prompt" class="state">
        <h2>Your score will appear here</h2>
        <p>Fill in the form and submit to generate a predicted mental health score from 0-10.</p>
      </div>
      <div id="state-loading" class="state hidden">
        <h2>Reading the signal...</h2>
        <p>Running your habits through the model.</p>
        <div class="loader"></div>
      </div>
      <div id="state-result" class="state hidden">
        <h2>Your Mental Health Score</h2>
        <div class="gauge"><div class="gauge-fill"></div><div class="gauge-dot" id="gauge-dot"></div></div>
        <div class="score"><span id="score-number">0.0</span><span>/10</span></div>
        <p id="score-context"></p>
        <button type="button" id="reset-btn" class="submit-btn" style="background:white; color:#0a3d3a;">Run another read</button>
      </div>
    </div>
  </div>

<script>
// Stress buttons
document.querySelectorAll('.stress-buttons button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stress-buttons button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('stress_level').value = btn.dataset.value;
  });
});

// Submit
document.getElementById('mh-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('state-prompt').classList.add('hidden');
  document.getElementById('state-loading').classList.remove('hidden');

  const data = Object.fromEntries(new FormData(e.target).entries());
  data.age = +data.age; data.avg_daily_usage_hours = +data.avg_daily_usage_hours;
  data.daily_unlocks = +data.daily_unlocks; data.study_hours = +data.study_hours;
  data.physical_activity_hours = +data.physical_activity_hours; data.sleep_hours_per_night = +data.sleep_hours_per_night;

  const res = await fetch('/predict', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
  const result = await res.json();
  
  document.getElementById('state-loading').classList.add('hidden');
  document.getElementById('state-result').classList.remove('hidden');
  document.getElementById('score-number').textContent = result.predicted_mental_health_score.toFixed(1);
  
  // Animate gauge
  const score = result.predicted_mental_health_score;
  const deg = (score / 10) * 180 - 90;
  document.getElementById('gauge-dot').style.transform = `rotate(${deg}deg)`;
});

document.getElementById('reset-btn').onclick = () => location.reload();
</script>
</body>
</html>
